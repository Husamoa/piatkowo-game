server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker bez cache, żeby zmiany od razu wchodziły przy lokalnych testach.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Poprawny typ dla manifestu (nie nadpisuje pozostałych typów z mime.types).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
